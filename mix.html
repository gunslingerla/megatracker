<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Megas — Mix notes</title>
<style>
  :root { --accent:#e5399f; --accent-2:#f057ac; --accent-soft:rgba(229,57,159,0.16); --bg-0:#0a0a0e; --bg-1:#100e16; --panel:#15131d; --panel-2:#1b1826; --panel-3:#241f33; --stroke:#2c2740; --stroke-strong:#3a3350; --text:#f3eef8; --muted:#b3a7c4; --good:#46dba0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg-0); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:820px; margin:0 auto; padding:24px 16px 120px; }
  .head { display:flex; align-items:baseline; gap:10px; margin-bottom:18px; }
  .head h1 { font-size:20px; margin:0; }
  .head .sub { color:var(--muted); font-size:13px; }
  .song { border:1px solid var(--stroke-strong); border-radius:12px; background:var(--panel-2); margin-bottom:14px; overflow:hidden; }
  .song-h { display:flex; align-items:center; gap:10px; padding:11px 14px; background:var(--panel-3); border-bottom:1px solid var(--stroke); }
  .song-h .t { font-weight:800; font-size:15px; }
  .song-h .v { color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
  .song-h .cnt { color:var(--good); font-size:12px; font-weight:700; margin-left:auto; }
  .play { flex:none; width:34px; height:34px; border-radius:50%; border:none; cursor:pointer; background:linear-gradient(140deg,var(--accent),var(--accent-2)); color:#1a0713; font-size:14px; display:grid; place-items:center; }
  .play[disabled] { opacity:0.4; cursor:default; }
  .nlist { padding:4px 14px 10px; }
  .n { display:flex; flex-direction:column; align-items:stretch; padding:11px 0; border-top:1px solid var(--stroke); }
  .n:first-child { border-top:none; }
  .n input[type=checkbox] { margin-top:3px; width:18px; height:18px; flex:none; cursor:pointer; accent-color:var(--good); }
  .n .body { flex:1; min-width:0; }
  .n .meta { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted); margin-bottom:2px; }
  .n .time { color:var(--accent-2); font-weight:700; font-variant-numeric:tabular-nums; background:none; border:none; padding:0; cursor:pointer; font-size:11px; }
  .n .time:hover { text-decoration:underline; }
  .n .cmt { font-size:14px; line-height:1.45; white-space:pre-wrap; }
  .n.done .cmt { opacity:0.5; }
  .nrow { display:flex; align-items:flex-start; gap:10px; }
  .thread { margin:8px 0 2px 28px; }
  .thmsgs { display:flex; flex-direction:column; gap:5px; }
  .thm { font-size:12.5px; line-height:1.4; padding:5px 8px; border-radius:8px; background:var(--panel-3); }
  .thm.me { background:var(--accent-soft); }
  .thby { font-weight:800; font-size:11px; margin-right:5px; }
  .threp { display:flex; gap:6px; margin-top:6px; }
  .thin { flex:1; background:var(--panel); border:1px solid var(--stroke-strong); border-radius:7px; color:var(--text); padding:5px 8px; font-size:12.5px; }
  .thsend { flex:none; background:var(--panel-2); color:var(--text); border:1px solid var(--stroke-strong); border-radius:7px; padding:5px 10px; font-size:12px; cursor:pointer; }
  .addnote { display:flex; flex-wrap:wrap; gap:6px; padding:12px 0 4px; border-top:1px solid var(--stroke); }
  .an-time { flex:none; width:62px; text-align:center; font-variant-numeric:tabular-nums; }
  .an-text { flex:1; min-width:140px; }
  .an-time, .an-text { background:var(--panel); border:1px solid var(--stroke-strong); border-radius:7px; color:var(--text); padding:6px 9px; font-size:13px; }
  .an-time.bad { border-color:#f0654f; }
  .an-btn { flex:none; background:linear-gradient(140deg,var(--accent),var(--accent-2)); color:#1a0713; border:none; border-radius:7px; padding:6px 12px; font-size:12.5px; font-weight:700; cursor:pointer; }
  .an-btn[disabled] { opacity:0.5; cursor:default; }
  .acts { margin-left:auto; flex:none; }
  .thm .acts { float:right; margin-left:8px; }
  .act { background:none; border:none; color:var(--muted); font-size:11px; cursor:pointer; padding:0 4px; text-decoration:underline; }
  .act:hover { color:var(--text); }
  .edtag { color:var(--muted); font-size:11px; }
  .edbox { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0; }
  .ed-in { flex:1; min-width:140px; background:var(--panel); border:1px solid var(--stroke-strong); border-radius:7px; color:var(--text); padding:5px 8px; font-size:13px; }
  .ed-save, .ed-cancel { flex:none; background:var(--panel-2); color:var(--text); border:1px solid var(--stroke-strong); border-radius:7px; padding:5px 10px; font-size:12px; cursor:pointer; }
  .empty { color:var(--muted); font-size:13px; padding:10px 0; }
  .state { padding:40px 0; text-align:center; color:var(--muted); }
  .foot { color:var(--muted); font-size:11px; margin-top:24px; text-align:center; }
  .player { position:fixed; left:0; right:0; bottom:0; background:rgba(16,14,22,0.97); border-top:1px solid var(--stroke-strong); padding:10px 16px; display:none; align-items:center; gap:12px; backdrop-filter:blur(10px); }
  .player.on { display:flex; }
  .player .now { font-size:12px; color:var(--muted); min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:40%; }
  .player audio { flex:1; height:36px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>The Megas</h1><span class="sub">Mix notes</span></div>
  <div id="app"><div class="state">Loading notes…</div></div>
  <div class="foot">The Megas — Album Tracker</div>
</div>
<div class="player" id="player"><span class="now" id="now"></span><audio id="audio" controls preload="none"></audio></div>
<script>
(function () {
  function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":"&gt;";}); }
  function mmss(s){ s=Math.max(0,Math.floor(s||0)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
  // "1:23", "83", or "1:02:03" -> seconds; null if it isn't a time.
  function parseTime(v){
    v = String(v||"").trim(); if (!v) return 0;
    var p = v.split(":"); if (p.length > 3 || p.some(function(x){ return !/^\d+(\.\d+)?$/.test(x); })) return null;
    return p.reduce(function(a,x){ return a*60 + Number(x); }, 0);
  }
  var params = new URLSearchParams(location.search);
  var token = params.get("t") || "";
  var slug = params.get("s") || "";
  var authQ = slug ? ("mixslug=" + encodeURIComponent(slug)) : ("mixtoken=" + encodeURIComponent(token));
  function authBody(extra) { var b = slug ? { mixslug: slug } : { mixtoken: token }; for (var k in extra) b[k] = extra[k]; return b; }
  var app = document.getElementById("app");
  var audio = document.getElementById("audio");
  var playerBar = document.getElementById("player");
  var nowEl = document.getElementById("now");
  var curId = null, byId = {}, shareTitle = "";
  if (!token && !slug) { app.innerHTML = '<div class="state">This link is missing its code. Ask the band for a fresh link.</div>'; return; }

  function loadSong(s, seek, play) {
    if (!s.url) return;
    if (curId !== s.id) {
      curId = s.id; audio.src = s.url;
      nowEl.textContent = s.title + (s.version ? " · " + s.version : "");
      playerBar.classList.add("on");
      if (seek != null) { var h=function(){ audio.currentTime = seek; if(play!==false) audio.play(); audio.removeEventListener("canplay", h); }; audio.addEventListener("canplay", h); }
      audio.load();
      if (seek == null && play !== false) audio.play().catch(function(){});
    } else {
      if (seek != null) audio.currentTime = seek;
      if (play !== false) audio.play().catch(function(){});
    }
  }

  function render(songs) {
    songs.forEach(function(s){ byId[s.id]=s; });
    if (!songs.length) { app.innerHTML = '<div class="state">No songs on this link.</div>'; return; }
    app.innerHTML = songs.map(function (s) {
      var open = s.notes.filter(function(n){return !n.reviewed;}).length;
      var rows = s.notes.length ? s.notes.map(function (n) {
        var th = (n.thread||[]);
        var msgs = th.map(function(mm){
          var mine = mm.side==="share" && mm.by===shareTitle && mm.at;
          return '<div class="thm '+(mm.side==="share"?"me":"band")+'" data-nid="'+n.id+'" data-at="'+(mm.at||"")+'">'
            + (mine ? '<span class="acts"><button class="act" data-op="editReply" data-id="'+n.id+'" data-at="'+mm.at+'">Edit</button><button class="act" data-op="deleteReply" data-id="'+n.id+'" data-at="'+mm.at+'">Delete</button></span>' : '')
            + '<span class="thby">'+esc(mm.by||"?")+'</span><span class="thtx">'+esc(mm.text)+'</span>'+(mm.edited?' <span class="edtag">(edited)</span>':'')+'</div>';
        }).join("");
        return '<div class="n'+(n.reviewed?" done":"")+'" data-id="'+n.id+'">'
          + '<div class="nrow">'
          + '<input type="checkbox" '+(n.reviewed?"checked":"")+' />'
          + '<span class="body"><span class="meta"><button class="time" data-song="'+s.id+'" data-t="'+n.timestamp+'">'+mmss(n.timestamp)+'</button>'+(n.author?'<span>'+esc(n.author)+'</span>':'')+(n.status==="Resolved"?'<span>· band resolved</span>':'')+(n.mine?'<span class="acts"><button class="act" data-op="editNote" data-id="'+n.id+'">Edit</button><button class="act" data-op="deleteNote" data-id="'+n.id+'">Delete</button></span>':'')+'</span>'
          + '<span class="cmt">'+esc(n.comment)+'</span></span></div>'
          + '<div class="thread"><div class="thmsgs">'+msgs+'</div><div class="threp"><input class="thin" data-rid="'+n.id+'" data-dk="r:'+n.id+'" placeholder="Reply or ask a question…" /><button class="thsend" data-sid="'+n.id+'">Send</button></div></div>'
          + '</div>';
      }).join("") : '<div class="empty">No notes on this version.</div>';
      return '<div class="song"><div class="song-h">'
        + (s.url?'<button class="play" data-play="'+s.id+'" title="Play">&#9654;&#xFE0E;</button>':'<button class="play" disabled title="No bounce yet">&#9654;&#xFE0E;</button>')
        + '<span class="t">'+esc(s.title)+'</span>'
        + (s.version?'<span class="v">'+esc(s.version)+'</span>':'')
        + '<span class="cnt">'+open+' to review</span>'
        + '</div><div class="nlist">'+rows
        + '<div class="addnote"><input class="an-time" data-dk="m:'+s.id+'" data-song="'+s.id+'" value="0:00" aria-label="Time in song" inputmode="numeric" />'
        + '<input class="an-text" data-dk="t:'+s.id+'" data-song="'+s.id+'" placeholder="Add your own note…" />'
        + '<button class="an-btn" data-song="'+s.id+'">Add note</button></div>'
        + '</div></div>';
    }).join("");

    // "Add your own note": the time box follows the player when this song is loaded, unless edited.
    app.querySelectorAll(".an-time").forEach(function (t) { t.addEventListener("input", function () { t.dataset.edited = "1"; t.classList.remove("bad"); }); });
    app.querySelectorAll(".an-text").forEach(function (inp) {
      inp.addEventListener("focus", function () {
        var t = app.querySelector('.an-time[data-song="'+inp.dataset.song+'"]');
        if (t && !t.dataset.edited && curId === inp.dataset.song) t.value = mmss(audio.currentTime);
      });
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); var b = app.querySelector('.an-btn[data-song="'+inp.dataset.song+'"]'); if (b) b.click(); } });
    });
    app.querySelectorAll(".an-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.dataset.song;
        var t = app.querySelector('.an-time[data-song="'+id+'"]');
        var inp = app.querySelector('.an-text[data-song="'+id+'"]');
        var text = inp ? inp.value.trim() : "";
        if (!text) { if (inp) inp.focus(); return; }
        var secs = parseTime(t ? t.value : "0:00");
        if (secs == null) { if (t) { t.classList.add("bad"); t.focus(); } return; }
        btn.disabled = true;
        fetch("/api/update", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(authBody({ newNote: true, trackId: id, timestamp: secs, text: text, version: (byId[id] && byId[id].version) || "" })) })
          .then(function(r){ return r.json(); })
          .then(function(j){ btn.disabled = false; if (j && j.ok) { inp.value = ""; if (t) { t.value = "0:00"; delete t.dataset.edited; } load(); } else { btn.textContent = "Try again"; setTimeout(function(){ btn.textContent = "Add note"; }, 2500); } })
          .catch(function(){ btn.disabled = false; btn.textContent = "Try again"; setTimeout(function(){ btn.textContent = "Add note"; }, 2500); });
      });
    });

    app.querySelectorAll("[data-play]").forEach(function(b){ b.addEventListener("click", function(){ loadSong(byId[b.dataset.play], null, true); }); });
    app.querySelectorAll(".time").forEach(function(b){ b.addEventListener("click", function(e){ e.preventDefault(); loadSong(byId[b.dataset.song], Number(b.dataset.t)||0, true); }); });
    app.querySelectorAll(".nrow input[type=checkbox]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        var row = cb.closest(".n");
        row.classList.toggle("done", cb.checked);
        cb.disabled = true;
        fetch("/api/update", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(authBody({ id: row.dataset.id, reviewed: cb.checked })) })
          .then(function(r){ return r.json(); })
          .then(function(j){ cb.disabled=false; if(!j||!j.ok){ cb.checked=!cb.checked; row.classList.toggle("done", cb.checked); } else { counts(); } })
          .catch(function(){ cb.disabled=false; cb.checked=!cb.checked; row.classList.toggle("done", cb.checked); });
      });
    });
    app.querySelectorAll(".thsend").forEach(function (btn) {
      function send() {
        var id = btn.dataset.sid;
        var inp = app.querySelector('.thin[data-rid="'+id+'"]');
        var text = inp ? inp.value.trim() : "";
        if (!text) return;
        btn.disabled = true;
        fetch("/api/update", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(authBody({ id: id, text: text })) })
          .then(function(r){ return r.json(); })
          .then(function(j){ btn.disabled=false; if(j&&j.ok){ if(inp) inp.value=""; load(); } })
          .catch(function(){ btn.disabled=false; });
      }
      btn.addEventListener("click", send);
      var inp = app.querySelector('.thin[data-rid="'+btn.dataset.sid+'"]');
      if (inp) inp.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); send(); } });
    });
  }
  // Edit / delete the guest's own replies and notes (event delegation: survives redraws).
  function findNote(id) { for (var sid in byId) { var ns = byId[sid].notes || []; for (var i = 0; i < ns.length; i++) if (ns[i].id === id) return ns[i]; } return null; }
  function manage(payload, onFail) {
    fetch("/api/update", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(authBody(payload)) })
      .then(function(r){ return r.json(); })
      .then(function(j){ if (j && j.ok) { load(); } else { alert((j && j.error) || "Couldn't save that. Please try again."); if (onFail) onFail(); } })
      .catch(function(){ alert("Couldn't save that. Please try again."); if (onFail) onFail(); });
  }
  function startEdit(btn) {
    var op = btn.dataset.op, id = btn.dataset.id, at = btn.dataset.at;
    var note = findNote(id); if (!note) return;
    var host, cur;
    if (op === "editReply") {
      host = app.querySelector('.thm[data-nid="'+id+'"][data-at="'+at+'"] .thtx');
      var msg = (note.thread||[]).filter(function(m){ return String(m.at) === String(at); })[0]; cur = msg ? msg.text : "";
    } else {
      host = app.querySelector('.n[data-id="'+id+'"] .cmt'); cur = note.comment;
    }
    if (!host) return;
    var box = document.createElement("div"); box.className = "edbox";
    var inp = document.createElement("input"); inp.className = "ed-in"; inp.value = cur;
    var save = document.createElement("button"); save.className = "ed-save"; save.textContent = "Save";
    var cancel = document.createElement("button"); cancel.className = "ed-cancel"; cancel.textContent = "Cancel";
    box.appendChild(inp); box.appendChild(save); box.appendChild(cancel);
    host.style.display = "none"; host.parentNode.insertBefore(box, host.nextSibling);
    function close() { box.remove(); host.style.display = ""; }
    function doSave() {
      var text = inp.value.trim(); if (!text) { inp.focus(); return; }
      if (text === cur) { close(); return; }
      save.disabled = true;
      var payload = { op: op, id: id, text: text }; if (op === "editReply") payload.at = Number(at);
      box.remove(); // drop the edit box first so the refresh isn't held back
      manage(payload, function(){ host.style.display = ""; });
    }
    save.addEventListener("click", doSave); cancel.addEventListener("click", close);
    inp.addEventListener("keydown", function(e){ if (e.key === "Enter") { e.preventDefault(); doSave(); } else if (e.key === "Escape") close(); });
    inp.focus(); try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) {}
  }
  app.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".act") : null; if (!b) return;
    var op = b.dataset.op;
    if (op === "editReply" || op === "editNote") { if (!app.querySelector(".ed-in")) startEdit(b); return; }
    if (!confirm(op === "deleteNote" ? "Delete this note? This can't be undone." : "Delete this reply? This can't be undone.")) return;
    var payload = { op: op, id: b.dataset.id }; if (op === "deleteReply") payload.at = Number(b.dataset.at);
    manage(payload);
  });

  function counts(){ app.querySelectorAll(".song").forEach(function(sg){ var open=sg.querySelectorAll(".n:not(.done)").length; var c=sg.querySelector(".cnt"); if(c) c.textContent=open+" to review"; }); }

  // Redraw only when notes/versions actually changed, and never lose a half-typed reply:
  // drafts (and which box has focus) are captured before a redraw and restored after.
  var lastSig = null;
  function refresh(songs) {
    if (app.querySelector(".ed-in")) return; // mid-edit: skip this tick, the next poll catches up
    var sig =JSON.stringify(songs.map(function (s) { return { id: s.id, v: s.version, n: s.notes }; }));
    if (sig === lastSig) { songs.forEach(function (s) { byId[s.id] = s; }); return; } // same content; just keep fresh stream URLs
    // Every typed-in box carries a data-dk key (reply, new-note text, new-note time).
    var drafts = {}, focusKey = null, selStart = null;
    app.querySelectorAll("[data-dk]").forEach(function (i) { if (i.value) drafts[i.dataset.dk] = i.value; });
    var ae = document.activeElement;
    if (ae && ae.dataset && ae.dataset.dk) { focusKey = ae.dataset.dk; selStart = ae.selectionStart; }
    lastSig = sig;
    render(songs);
    app.querySelectorAll("[data-dk]").forEach(function (i) {
      var k = i.dataset.dk;
      if (drafts[k] != null) { i.value = drafts[k]; if (k.charAt(0) === "m" && drafts[k] !== "0:00") i.dataset.edited = "1"; }
    });
    if (focusKey) {
      var f = app.querySelector('[data-dk="' + focusKey + '"]');
      if (f) { f.focus(); try { f.setSelectionRange(selStart, selStart); } catch (e) {} }
    }
  }

  function load() {
    fetch("/api/data?" + authQ)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) { shareTitle = j.title || ""; refresh(j.songs || []); })
      .catch(function () { lastSig = null; app.innerHTML = '<div class="state">This link is invalid or expired. Ask the band for a fresh one.</div>'; });
  }
  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
