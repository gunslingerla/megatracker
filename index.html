<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#e5399f" />
  <title>The Megas — Album Tracker</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="topbar">
    <button class="nav-btn" id="navBtn" title="Navigation" aria-label="Open navigation">&#8250;</button>
    <div class="brand">
      <div class="logo">M</div>
      <div class="titles">
        <div class="band">The Megas</div>
        <div class="app">Album Tracker</div>
      </div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-view="tracks">Dashboard</button>
      <button class="tab" data-view="preview">Preview Albums</button>
      <button class="tab" data-view="members">Assignments</button>
      <button class="tab" data-view="roster">Band</button>
      <button class="tab" data-view="calendar">Calendar</button>
    </div>
    <div class="spacer"></div>
    <button class="menu-btn" id="menuBtn" title="Menu" aria-label="Open menu">&#8249;</button>
  </div>

  <div id="albumStrip"></div>
  <div id="main"><div class="loading">Loading the board…</div></div>

  <div class="nav-scrim" id="navScrim"></div>
  <nav class="navmenu" id="navmenu" aria-label="Sections">
    <div class="navmenu-head"><span>The Megas</span><button class="icon-btn" id="navClose" aria-label="Close navigation">&times;</button></div>
    <button class="navitem" data-view="tracks">Dashboard</button>
    <button class="navitem" data-view="preview">Preview Albums</button>
    <button class="navitem" data-view="members">Assignments</button>
    <button class="navitem" data-view="roster">Band</button>
    <button class="navitem" data-view="calendar">Calendar</button>
  </nav>

  <div class="menu-scrim" id="menuScrim"></div>
  <nav class="sidemenu" id="sidemenu" aria-label="Actions">
    <div class="sidemenu-head"><span>Menu</span><button class="icon-btn" id="menuClose" aria-label="Close menu">&times;</button></div>
    <button class="add-btn" id="newTrack" title="Add a track">+ Track</button>
    <button class="add-btn ghost" id="newAlbum" title="Add an album">+ Album</button>
    <button class="add-btn ghost" id="whoami" title="Set your name">You</button>
    <button class="add-btn ghost" id="refresh" title="Refresh">Refresh</button>
    <button class="add-btn ghost" id="logout" title="Sign out">Sign out</button>
  </nav>

  <div class="scrim" id="scrim"></div>
  <div class="drawer" id="drawer"></div>
  <div class="toast" id="toast"></div>
  <div class="player hidden" id="player"></div>
  <audio id="audio" preload="none"></audio>
  <div class="modal-scrim" id="mscrim"></div>
  <div class="modal" id="modal"></div>
  <div class="teleprompter" id="teleprompter"></div>
  <div class="lightbox" id="lightbox"></div>

  <script src="/app.js"></script>
</body>
</html>
