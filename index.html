<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#e5399f" />
  <title>The Megas — Album Tracker</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="logo">M</div>
      <div class="titles">
        <div class="band">The Megas</div>
        <div class="app">Album Tracker</div>
      </div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-view="tracks">Tracks</button>
      <button class="tab" data-view="preview">Preview Albums</button>
      <button class="tab" data-view="albums">Albums</button>
      <button class="tab" data-view="members">Assignments</button>
      <button class="tab" data-view="roster">Band</button>
      <button class="tab" data-view="calendar">Calendar</button>
      <button class="tab" data-view="hold">On Hold</button>
    </div>
    <div class="spacer"></div>
    <div class="filters" id="filters">
      <select id="filterAlbum"></select>
      <select id="filterIP"><option value="">All inspirations</option></select>
      <select id="filterMember"><option value="">All members</option></select>
      <button class="add-btn" id="newTrack" title="Add a track">+ Track</button>
      <button class="add-btn ghost" id="newAlbum" title="Add an album">+ Album</button>
      <button class="add-btn ghost" id="whoami" title="Set your name">You</button>
      <button class="add-btn ghost" id="refresh" title="Refresh">Refresh</button>
      <button class="add-btn ghost" id="logout" title="Sign out">Sign out</button>
    </div>
  </div>

  <div id="albumStrip"></div>
  <div id="main"><div class="loading">Loading the board…</div></div>

  <div class="scrim" id="scrim"></div>
  <div class="drawer" id="drawer"></div>
  <div class="toast" id="toast"></div>
  <div class="player hidden" id="player"></div>
  <audio id="audio" preload="none"></audio>
  <div class="modal-scrim" id="mscrim"></div>
  <div class="modal" id="modal"></div>
  <div class="teleprompter" id="teleprompter"></div>

  <script src="/app.js"></script>
</body>
</html>
